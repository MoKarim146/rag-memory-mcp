<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">Attack tests, before and after the fixes</title>
<desc id="d">First audit: 17 of 37 passed before the fixes, 38 of 38 after; OWASP LLM Top 10 (2026): 12 of 41 passed before the fixes, 41 of 41 after</desc>
<rect width="760" height="250" rx="12" fill="#1a1a19"/>
<g font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<text x="24" y="34" font-size="17" font-weight="600" fill="#f0efec">Attack tests, before and after the fixes</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">Tests were written first and run on the old code, then the code was fixed. Fuzz tests found 5 more bugs, all fixed.</text>
<rect x="24" y="72" width="12" height="12" rx="3" fill="#3987e5"/><text x="46" y="82" font-size="13" fill="#c3c2b7">After the fixes</text><rect x="178" y="72" width="12" height="12" rx="3" fill="#d95926"/><text x="200" y="82" font-size="13" fill="#c3c2b7">Before the fixes</text><text x="24" y="122" font-size="13" font-weight="600" fill="#f0efec">First audit</text><text x="24" y="140" font-size="12" fill="#898781">38 tests</text><path d="M230,106 H626 Q630,106 630,110 V120 Q630,124 626,124 H230 Z" fill="#3987e5"><title>First audit, after the fixes: 38 of 38 passed</title></path><text x="636" y="120" font-size="12" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">38 of 38</text><path d="M230,126 H409.7837837837838 Q413.7837837837838,126 413.7837837837838,130 V140 Q413.7837837837838,144 409.7837837837838,144 H230 Z" fill="#d95926"><title>First audit, before the fixes: 17 of 37 passed</title></path><text x="419.7837837837838" y="140" font-size="12" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">17 of 37</text><text x="24" y="178" font-size="13" font-weight="600" fill="#f0efec">OWASP LLM Top 10 (2026)</text><text x="24" y="196" font-size="12" fill="#898781">41 tests</text><path d="M230,162 H626 Q630,162 630,166 V176 Q630,180 626,180 H230 Z" fill="#3987e5"><title>OWASP LLM Top 10 (2026), after the fixes: 41 of 41 passed</title></path><text x="636" y="176" font-size="12" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">41 of 41</text><path d="M230,182 H343.0731707317073 Q347.0731707317073,182 347.0731707317073,186 V196 Q347.0731707317073,200 343.0731707317073,200 H230 Z" fill="#d95926"><title>OWASP LLM Top 10 (2026), before the fixes: 12 of 41 passed</title></path><text x="353.0731707317073" y="196" font-size="12" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">12 of 41</text><line x1="230" y1="102" x2="230" y2="204" stroke="#383835" stroke-width="1"/>
